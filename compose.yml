services:
  db:
    image: postgres:latest
    container_name: shopcartdb
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: shopcart
    volumes:
      - /home/yassa-talaat/shopcart-data:/var/lib/postgresql
